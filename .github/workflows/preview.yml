name: Preview video
# Records a scene of the Godot game to an MP4 (no APK). Runs on a push whose message has [preview]
# (the APK workflow skips those), or by hand once this file is on the default branch.
# The video goes to the "preview-video" release.
on:
  push:
  workflow_dispatch:
    inputs:
      t:
        description: dev scene (--t=)
        default: areaend
      name:
        description: file name (no .mp4)
        default: area1-end
      secs:
        description: longest run in seconds
        default: '1200'
permissions:
  contents: write
jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[preview]')
    runs-on: ubuntu-latest
    env:
      T: ${{ github.event.inputs.t || 'areaend,area2' }}
      NAME: ${{ github.event.inputs.name || 'area1-end' }}
      SECS: ${{ github.event.inputs.secs || '1200' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Get Godot 4.3, Xvfb, Mesa, ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri ffmpeg > /dev/null
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot-bin
      - name: Import
        run: |
          cd godot
          ../godot-bin --headless --import --path . > /dev/null 2>&1 || true
          ../godot-bin --headless --editor --quit --path . > /dev/null 2>&1 || true
          ../godot-bin --headless --editor --quit --path . 2>&1 | grep -i "error" | grep -v "imported\|Make sure\|at: " | head -30 || true
          ls .godot/imported | wc -l
      - name: Record
        run: |
          cd godot
          export LIBGL_ALWAYS_SOFTWARE=1
          mkdir -p /tmp/vid
          for t in areaend area2; do
            timeout 3000 xvfb-run -a -s "-screen 0 1280x1800x24" ../godot-bin --path . --rendering-driver opengl3 \
              --resolution 360x780 --fixed-fps 20 --write-movie /tmp/vid/$t.avi -- --t=$t --wait=1 --quit=1 > /dev/null 2>&1 || true
            ffmpeg -y -loglevel error -i /tmp/vid/$t.avi -vf "scale=360:-2" -c:v libx264 -preset veryfast -crf 26 -pix_fmt yuv420p \
              -c:a aac -b:a 96k -movflags +faststart /tmp/vid/$t.mp4 || true
            ls -la /tmp/vid
            cd ..
            git config user.name ci && git config user.email ci@example.com
            git fetch -q origin ci-shots || true
            git checkout -q -B ci-video
            git rm -rfq . > /dev/null
            cp /tmp/vid/*.mp4 . && git add *.mp4 && git commit -qm "video $t" && git push -fq origin ci-video
            git checkout -q -f "$GITHUB_SHA"
            cd godot
          done
