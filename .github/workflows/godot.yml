name: Godot APK
on:
  push:
    paths:
      - 'godot/**'
      - 'tools/cmads-android/**'
      - '.github/workflows/godot.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: godot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Get Godot 4.3 and export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot-bin
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable tpl
          unzip -q Godot_v4.3-stable_export_templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/4.3.stable/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the ads plugin (AAR)
        run: |
          cd tools/cmads-android
          gradle :cmads:assembleRelease --no-daemon -q
          mkdir -p ../../godot/addons/cmads/bin
          cp cmads/build/outputs/aar/cmads-release.aar ../../godot/addons/cmads/bin/
      - name: Android settings and debug key
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOT
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres
      - name: Import and export
        run: |
          cd godot
          ../godot-bin --headless --editor --quit --path . || true
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          ../godot-bin --headless --path . --install-android-build-template --export-release "Android" build/CrackersMatchGodot.apk
          ls -la build
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG=godot-dev
          if printf '%s' "$MSG" | grep -q "\[final\]"; then TAG=godot-test; fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" godot/build/CrackersMatchGodot.apk --target "$GITHUB_SHA" --title "Crackers Match Godot (test build)" --prerelease \
            --notes "Godot build ${GITHUB_RUN_NUMBER}. Installs next to the old app. Download CrackersMatchGodot.apk on your phone and open it."
