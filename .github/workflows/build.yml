name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CrackersMatch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CrackersMatch-apk
          path: CrackersMatch.apk
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=test-build
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" CrackersMatch.apk --target "$GITHUB_SHA" --title "Crackers Match (test build)" --prerelease \
            --notes "Build ${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME}. Download CrackersMatch.apk on your Android phone and open it to install."
