let OPT='B';
function dom(html,cls){const d=document.createElement('div');d.className='fx '+(cls||'');d.innerHTML=html;APP.appendChild(d);return d}
function trailDot(x,y,col,size,life){const d=dom('','');d.style.cssText+=`left:${x}px;top:${y}px;width:${size}px;height:${size}px;border-radius:50%;background:radial-gradient(circle,#fff 0,${col} 40%,transparent 70%);transition:opacity ${life}s,transform ${life}s`;requestAnimationFrame(()=>{d.style.opacity=0;d.style.transform='translate(-50%,-50%) scale(.2)'});setTimeout(()=>d.remove(),life*1000+50)}

function spendFx(T,done){const r=$('hBuild').getBoundingClientRect(),a=APP.getBoundingClientRect(),x0=r.left-a.left+r.width/2,y0=r.top-a.top+r.height/2;const site=T.site.clone();
 if(OPT=='A'){const c=dom('<img src="art/ui-coin.webp" style="width:44px;height:44px;display:block;filter:drop-shadow(0 0 10px #ffd24a)">');let lt=0;
  tween(1.1,k=>{const tg=toScreen(site),e=1-Math.pow(1-k,2.2),x=x0+(tg[0]-x0)*e,y=y0+(tg[1]-y0)*e-Math.sin(e*PI)*110;c.style.left=x+'px';c.style.top=y+'px';c.style.transform=`translate(-50%,-50%) scale(${1-.45*k}) rotateY(${k*720}deg)`;if(clock-lt>.03){lt=clock;trailDot(x+rnd(-6,6),y+rnd(-6,6),'#ffcf3a',rnd(10,18),.5)}});
  after(1.1,()=>{c.remove();burst(site);done()})}
 else if(OPT=='B'){let lt=0;const h=dom('','');h.style.cssText+='width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,#fff 0,#fff6c8 30%,#ffc23a 55%,transparent 72%)';
  tween(.8,k=>{const tg=toScreen(site),e=k*k*(3-2*k),x=x0+(tg[0]-x0)*e+Math.sin(e*PI)*40,y=y0+(tg[1]-y0)*e-Math.sin(e*PI)*60;h.style.left=x+'px';h.style.top=y+'px';if(clock-lt>.012){lt=clock;trailDot(x,y,'#ffd86a',26,.45);trailDot(x+rnd(-8,8),y+rnd(-8,8),'#ffffff',8,.6)}});
  after(.8,()=>{h.remove();burst(site);after(.3,done)})}
 else if(OPT=='C'){const cr=PC_('Crate_Wooden',site.x,14,site.z,0,1.4);tween(.75,k=>{cr.position.y=14-14*k*k;cr.rotation.y=k*4;cr.rotation.x=(1-k)*.6},.35);
  after(1.1,()=>{dust(site,16,1.6);ring(site,0xffffff,.1);tween(.35,k=>{cr.scale.setScalar(1.4*(1+k*.3));cr.traverse(o=>{if(o.material){o.material.transparent=true}});if(k>=1)S.remove(cr)},.15);after(.4,()=>{burst(site);done()})})}
 else{const pil=[];for(let i=0;i<5;i++){const sp=sprite(GLOW,.1,0xffd86a,1);sp.position.set(site.x,.6+i*1.2,site.z);S.add(sp);pil.push(sp)}
  after(.3,()=>{ring(site,0xffe27a,.12);ring(site,0xffffff,.12)});tween(.9,k=>pil.forEach((sp,i)=>{sp.scale.setScalar(Math.sin(k*PI)*(3.2-i*.4));sp.material.opacity=Math.sin(k*PI)}),.3);after(.75,()=>sparkle(site,30,1));after(1.2,()=>{pil.forEach(sp=>S.remove(sp));done()})}}
function win(){won=1;$('ban').classList.add('on');camTo(V(0,9.5,-24),V(0,6.5,-58),1.6);ui()}
function ui(){$('dn').textContent=diyas;$('fill').style.width=(step/TASKS.length*100)+'%';$('cnt').textContent=step+'/'+TASKS.length;const T=TASKS[step],n=canDo();
 $('allb').classList.toggle('on',!busy&&n>=2);$('allb').textContent='Build All ('+n+')';
 if(!T){$('ic').textContent='🎉';$('kind').textContent='Area complete';$('nm').textContent='The Village Is Alive!';$('go').style.display='none';return}
 $('ic').textContent=T.ic;$('kind').textContent='Task '+(step+1)+' of '+TASKS.length;$('nm').textContent=T.n;$('cost').textContent=T.c;$('go').disabled=busy||diyas<T.c}
$('go').onclick=()=>doTask(0);$('allb').onclick=()=>doTask(1);$('rs').onclick=()=>location.reload();
let last=0,fwT=0;
function loop(now){const dt=Math.min(DTCAP,(now-last)/1000||0)*SPEED;last=now;clock+=dt;
 const cur=TW.splice(0),keep=[];cur.forEach(o=>{o.t+=dt;if(o.t<0){keep.push(o);return}const k=Math.min(1,o.t/o.d);o.fn(k);if(k<1)keep.push(o)});TW.push(...keep);
 cam.position.copy(camP);cam.lookAt(camL);
 if(camP.y>20){sun.target.position.set(0,0,-6);sun.position.set(-40,45,40);sun.shadow.camera.left=-45;sun.shadow.camera.right=45;sun.shadow.camera.top=75;sun.shadow.camera.bottom=-75}else{sun.target.position.copy(camL);sun.position.set(camL.x-26,30,camL.z+20);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-28}sun.shadow.camera.updateProjectionMatrix();R.toneMappingExposure=EXPO;
 EM.forEach(e=>{e.a+=dt*e.r;while(e.a>1){e.a--;if(e.k=='smoke')part(SOFT,e.p.clone().add(V(rnd(-.15,.15),0,rnd(-.15,.15))),{s0:.7,s1:2.6,col:0xd8d0d0,op:.5,v:V(rnd(.1,.4),rnd(.6,1),rnd(-.15,.15)),d:3.2});else if(e.k=='steam')part(SOFT,e.p.clone(),{s0:.15,s1:.6,col:0xffffff,op:.5,v:V(rnd(-.05,.05),rnd(.3,.5),rnd(-.05,.05)),d:1.6});else part(GLOW,e.p.clone(),{s0:.25,s1:.05,col:0xffa040,add:1,v:V(rnd(-1.2,1.2),rnd(1.5,3),rnd(-1.2,1.2)),g:9,d:.6})}});
 for(let i=FX.length-1;i>=0;i--){const o=FX[i];o.t+=dt;const q=Math.min(1,o.t/o.d);o.s.position.addScaledVector(o.v,dt);o.v.y-=o.g*dt;o.s.scale.setScalar(o.s0+(o.s1-o.s0)*q);o.s.material.opacity=o.op*(1-q*q);if(q>=1){S.remove(o.s);o.s.material.dispose();FX.splice(i,1)}}
 UPD.forEach(f=>f(dt));if(SHOW){fwT-=dt;if(fwT<=0){firework();fwT=rnd(.3,.6)}}
 if(SHOW3D)R.render(S,cam);requestAnimationFrame(loop)}

// ---------- intro -> title -> street ----------
let SHOW3D=false,READY=false,busyT=1;
const FW={P:[],on:false};function fwBurst(x,y,n,sp,cols){for(let i=0;i<n;i++){const a=i/n*6.283+Math.random()*.2,v=sp*(.5+Math.random()*.55);FW.P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1+Math.random()*.8,c:cols[i%cols.length],w:1.6+Math.random()*1.6})}fwRun()}
function fwRocket(x0,x1,y1,dur,cb){FW.P.push({rk:1,x:x0,y:FW.H+10,x0,x1,y1,t:0,dur,cb});fwRun()}
function fwRun(){if(FW.on)return;FW.on=true;const cv=$('fwc'),W=cv.clientWidth||$("app").clientWidth,H=cv.clientHeight||$("app").clientHeight;FW.W=W;FW.H=H;cv.width=W*2;cv.height=H*2;const x=cv.getContext('2d');x.setTransform(2,0,0,2,0,0);let last=performance.now();
 (function f(now){const dt=Math.min(.12,(now-last)/1000);last=now;x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
  for(let i=FW.P.length-1;i>=0;i--){const p=FW.P[i];if(p.rk){p.t+=dt;const k=Math.min(1,p.t/p.dur);p.x=p.x0+(p.x1-p.x0)*k;p.y=H+10-(H+10-p.y1)*(1-(1-k)*(1-k));x.fillStyle='#fff';x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill();FW.P.push({x:p.x,y:p.y+4,vx:rnd(-12,12),vy:rnd(20,70),l:.35,c:'#FFB020',w:2});if(k>=1){FW.P.splice(i,1);p.cb&&p.cb(p.x,p.y)}continue}
   p.l-=dt;if(p.l<=0){FW.P.splice(i,1);continue}p.vy+=80*dt;p.vx*=.985;p.vy*=.985;p.x+=p.vx*dt;p.y+=p.vy*dt;x.globalAlpha=Math.min(1,p.l);x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.w,0,7);x.fill()}
  x.globalAlpha=1;x.globalCompositeOperation='source-over';if(FW.P.length||FW.keep)requestAnimationFrame(f);else{FW.on=false;x.clearRect(0,0,W,H)}})(last)}
const GOLD=['#FFE27A','#FFFFFF','#FFB020','#FF4B6E'],RAINBOW=['#FF4D6D','#FFD24A','#3AD06A','#4AA3FF','#C86BFF','#FFFFFF'];

function layer(){return '<div class="tsc"></div><div class="tlogo"><div class="r1"><span class="s">CRACKERS</span><span class="f">CRACKERS</span></div><div class="r2"><span class="s">MATCH</span><span class="f">MATCH</span></div></div><div class="ttap">Tap to Play</div>'}
// ---------- link to the game (parent page). Opened alone it runs as a preview with local state.
const CM=(function(){try{if(window.parent&&window.parent!==window&&window.parent.CM28)return window.parent.CM28}catch(e){}
 const st={lv:0,diyas:0,coins:300,step:0,agreed:0};return{S:()=>st,save:()=>{},play:()=>toast('The level opens here'),sheet:n=>toast(n+' opens here'),notify:()=>{},ready:()=>{}}})();
const GS=CM.S();
function save(){CM.save()}
function toast(t){const d=$('toast');d.textContent=t;d.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>d.classList.remove('on'),1800)}
// ---------- title
const TS=[];function buildTitle(){const h=$('hTop');h.innerHTML=layer();const root=h.querySelector('.tsc');const sc=new Scene(root,{ch:1});const fr=document.createElement('div');fr.className='fr';root.insertBefore(fr,root.querySelector('.cloud'));sc.start();TS.push(sc)}
function setLogo(on){document.querySelectorAll('#sTitle .tlogo').forEach(l=>l.classList.toggle('on',on))}
function showTap(){document.querySelectorAll('#sTitle .ttap').forEach(l=>l.classList.add('on'))}
function playScreens(){buildTitle();const st=$('sTitle'),si=$('sIntro');
 setTimeout(()=>{st.style.transition='none';st.classList.remove('off');void st.offsetWidth;st.style.transition='';si.classList.add('off');fwRun();
  const reveal=()=>fwRocket(FW.W/2,FW.W/2,FW.H*.2,.9,(x,y)=>{fwBurst(x,y,140,260,GOLD);fwBurst(x,y,60,140,GOLD);setLogo(true);
   setTimeout(()=>{fwBurst(FW.W*.2,FW.H*.17,70,170,GOLD);fwBurst(FW.W*.8,FW.H*.24,70,170,GOLD)},400);
   const wait=()=>{if(READY){showTap();busyT=0}else setTimeout(wait,200)};setTimeout(wait,900)});
  if(GS.agreed)reveal();else{ov('oAgree',true);$('bAgree').onclick=()=>{GS.agreed=1;save();ov('oAgree',false);setTimeout(reveal,350)}}},2600)}
$('sTitle').addEventListener('pointerdown',()=>{if(busyT||$('sTitle').classList.contains('off'))return;busyT=1;const first=!(GS.lv>0);
 if(!first){SHOW3D=true;syncIn();camHome(true);R.render(S,cam)}
 $('glow').classList.add('on');$('sTitle').classList.add('fade');setTimeout(()=>$('glow').classList.remove('on'),450);
 setTimeout(()=>{$('sTitle').classList.add('off');$('sTitle').classList.remove('fade');TS.forEach(sc=>sc.stop());busyT=0;if(first)CM.play(true);else showHome()},900)});
// ---------- state in and out of the game
function syncIn(){diyas=GS.diyas||0;const n=Math.min(GS.step||0,TASKS.length);if(n>step)skipTo(n)}
function syncOut(){GS.diyas=diyas;GS.step=step;save()}
// ---------- home buttons
function homeUI(){const n=Math.min(step,TASKS.length);$('hCnt').textContent=n;$('hBar').style.width=(n/TASKS.length*100)+'%';$('tDy').textContent=diyas;$('tCoin').textContent=GS.coins||0;
 let c=0,d=diyas;for(let i=step;i<TASKS.length;i++){if(d<TASKS[i].c)break;d-=TASKS[i].c;c++}$('hBadge').textContent=c;$('hBadge').style.display=c?'block':'none';
 const T=TASKS[step];$('hBuild').disabled=busy||!T||diyas<T.c;
 const lvN=(GS.lv||0)+1,all=CM.levels?CM.levels():10;$('hPlay').querySelector('.f').innerHTML=lvN>all?'Area 2 Soon':'Level <span class="t2">'+lvN+'</span>';$('hPlay').disabled=lvN>all}
function camHome(instant){if(!VIEWS)buildViews();if(step>=TASKS.length){camTo(V(0,9.5,-24),V(0,6.5,-58),instant?0.01:1.6);return}const v=VIEWS[step];if(instant){CAMID++;camP.copy(v.p);camL.copy(v.look)}else glideTo(v)}
function showHome(){syncOut();$('home').classList.remove('off');homeUI();if(step==0&&!GS.tut&&diyas>=TASKS[0].c)setTimeout(tutorial,700);else if((GS.lv||0)>=2&&!GS.notif28)setTimeout(()=>ov('oNotif',true),700)}

let TUT=0;function tutorial(){const app=$('app').getBoundingClientRect(),pill=$('tDy').closest('.pl'),tip=$('tip'),h=$('hand');TUT=1;$('home').style.zIndex='auto';$('tdim').classList.add('on');pill.classList.add('lift');
 const pr=pill.getBoundingClientRect();tip.textContent=diyas==1?'You earned 1 diya! Use diyas to build your street.':'You earned '+diyas+' diyas! Use them to build your street.';tip.style.display='block';tip.style.bottom='auto';tip.style.top=(pr.bottom-app.top+18)+'px';tip.style.setProperty('--ar','block');tip.style.setProperty('--ax',(pr.left-app.left+pr.width/2-16)+'px');h.style.display='none';
 const next=()=>{if(TUT!=1)return;TUT=2;pill.classList.remove('lift');const b=$('hBuild');b.classList.add('lift','glow');const br=b.getBoundingClientRect();tip.textContent='Tap Build to build the '+TASKS[0].n.replace(/^Build the /,'')+'!';tip.style.top='auto';tip.style.bottom=(app.bottom-br.top+26)+'px';tip.style.setProperty('--ar','none');
  h.style.display='block';h.style.left=(br.left-app.left+br.width*.5-22)+'px';h.style.top=(br.bottom-app.top-18)+'px'};
 $('tdim').onclick=next;tip.onclick=next}
function endTutorial(){if(!TUT)return;TUT=0;GS.tut=1;save();$('home').style.zIndex='';$('tdim').classList.remove('on');$('tip').style.display='none';$('hand').style.display='none';$('hBuild').classList.remove('lift','glow');$('tDy').closest('.pl').classList.remove('lift')}
$('hPlay').onclick=()=>{if(busy||TUT||$('hPlay').disabled)return;syncOut();CM.play(false)};
$('hBuild').onclick=()=>{if(busy||$('hBuild').disabled||TUT==1)return;endTutorial();hideHome();doTask(0)};

window.STREET={
 back:function(){SHOW3D=true;syncIn();camHome(true);R.render(S,cam);$('sTitle').classList.add('off');$('sIntro').classList.add('off');showHome()},
