<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Crackers Match</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="style.css"></head><body>
<section id="intro"><canvas id="introGL"></canvas><img src="art/retroraja_logo.png" alt="RetroRaja Games"><div class="studio">RETRORAJA GAMES</div>
 <div class="ttl" id="ttl"><div class="tstr"></div><div class="logo tl" id="tlogo"><b>Crackers</b><i>Match</i></div><div class="tcr" id="tcr"><img id="tcrI" alt=""><u></u></div></div></section>
<div id="stage">
<section id="home" class="scr"><div id="map"><div id="mapIn"><img src="art/map.webp" alt="" draggable="false"><img id="guyM" class="guy m" src="art/man.webp" alt="" draggable="false"><img id="guyW" class="guy w" src="art/woman.webp" alt="" draggable="false"><div id="stops"></div></div></div>
 <div class="top"><div class="logo sm"><b>Crackers</b><i>Match</i></div><div class="pills"><div class="pill"><img src="art/ui-coin.webp" alt="Coins"><b id="hCoins">0</b></div><div class="pill"><img src="art/ui-diya.webp" alt="Diyas"><b id="hDiyas">0</b></div></div></div>
 <div class="foot"><button class="sq" id="bSound" aria-label="Sound">&#9834;</button><button class="play" id="bPlay">Play</button><button class="sq" id="bReset" aria-label="Restart game">&#8635;</button></div></section>
<section id="game" class="scr"><div class="hud"><button class="sq sm" id="bQuit" aria-label="Back to map">&#8249;</button><div class="hgoals" id="gGoals"></div><div class="mv"><small id="gName">Level 1</small><b id="gMoves">20</b><small>moves</small></div></div><div class="gcoin"><img src="art/ui-coin.webp" alt="Coins"><b id="gCoins">0</b></div>
 <canvas id="board"></canvas><div class="slots" id="slots"></div><div id="endDim"></div><div class="cheer" id="cheer"></div><div class="shuf" id="shuf">No matches left. Mixing the tiles</div><div id="bw"></div><canvas id="sp" width="780" height="1688"></canvas></section>
<section id="win" class="scr"><h1>Level Complete!</h1><div class="wstars" id="wStars"></div><div class="wcoin" id="wCoins"></div><div class="wrew" id="wRew"><img id="wRewI" alt=""><span id="wRewT"></span></div><img class="wg m" src="art/man.webp" alt=""><img class="wg w" src="art/woman.webp" alt=""><i class="spk wsp"></i><button class="play nxt" id="bNext">Continue</button></section>
<section id="lose" class="scr"><div class="box"><h1>Out of moves</h1><p>So close! Keep going?</p><button class="play" id="bAd">Watch video: +4 moves</button><button class="play alt" id="bCoin">300 coins: +5 moves</button><p class="lmsg" id="lMsg"></p><button class="ghost" id="bRetry">Try level again</button><button class="ghost" id="bHome">Back to map</button></div></section>
<section id="done" class="scr"><div class="box"><h1>You finished level 10!</h1><p>More levels are coming.</p><button class="play" id="bHome2">Back to map</button></div></section>
<div class="modal" id="lc"><div class="hang"><i class="str a"></i><i class="str b"></i><div class="lcard"><button class="x" id="lClose" aria-label="Close">&#215;</button><h2 id="lNum"></h2><p id="lName"></p><div class="lgoals" id="lGoals"></div><small id="lMoves"></small><h3>Buy crackers for this level <span class="have"><img src="art/ui-coin.webp" alt="Coins"><b id="lCoins">0</b></span></h3><div class="lboost" id="lBoost"></div><button class="play" id="lPlay">Play</button></div></div></div>
<div class="modal ban" id="ban"><div class="bin"><img id="bImg" alt=""><h2 id="bTitle"></h2><p id="bLine"></p><small>Tap to continue</small></div></div><div class="modal buy" id="buy"><div class="box"><img id="buyI" alt=""><h1 id="buyT"></h1><p id="buyP"></p><button class="play" id="buyY">Buy</button><button class="ghost" id="buyN">Not now</button></div></div>
<svg id="hand" width="72" height="88" viewBox="0 0 72 88" aria-hidden="true"><path d="M26 8c0-7 11-7 11 0v28c1-6 11-6 11 1 1-5 10-4 10 2 1-4 9-3 9 3v18c0 13-8 24-22 24H37c-9 0-14-5-19-13L4 47c-3-6 5-11 9-6l13 13z" fill="#FFD9B8" stroke="#1F1B3A" stroke-width="3" stroke-linejoin="round"/></svg><img id="ghost" alt="">
</div>
<script src="art/crackers.js"></script><script src="fx.js"></script><script src="art/sounds-data.js"></script><script src="sound.js"></script><script src="art/three.min.js"></script><script src="intro.js"></script><script src="levels.js"></script><script src="app.js"></script>
</body></html>
