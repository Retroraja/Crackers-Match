<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Crackers Match</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="style.css"></head><body>
<section id="intro"><canvas id="introGL"></canvas><img src="art/retroraja_logo.png" alt="RetroRaja Games"><div class="studio">RETRORAJA GAMES</div>
 <div class="ttl" id="ttl"></div></section>
<div id="stage">
<section id="home" class="scr"><div id="hScn"></div>
 <div class="htop"><div class="pill"><img src="art/ui-coin.webp" alt="Coins"><b id="hCoins">0</b></div><div class="pill"><span class="pst">&#9733;</span><b id="hStars">0</b></div></div>
 <div id="chap">Chapter 1 · Green Village</div>
 <div class="hrow"><div id="strip"><div id="track"></div></div></div><div id="htoast"></div>
 <nav class="nav" aria-label="Main menu">
  <button type="button" data-p="shop" aria-label="Shop"><svg viewBox="0 0 40 40"><path d="M6 16h28v18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z" fill="#fff"/><path d="M4 10l4-6h24l4 6v4a4 4 0 0 1-8 0 4 4 0 0 1-8 0 4 4 0 0 1-8 0 4 4 0 0 1-8 0z" fill="#FF5C8A"/><rect x="16" y="24" width="8" height="12" rx="1" fill="#7B68E0"/></svg>Shop</button>
  <button type="button" data-p="daily" aria-label="Daily reward"><svg viewBox="0 0 40 40"><rect x="5" y="8" width="30" height="28" rx="4" fill="#fff"/><rect x="5" y="8" width="30" height="9" rx="4" fill="#FF5C8A"/><rect x="11" y="4" width="4" height="8" rx="2" fill="#2E2380"/><rect x="25" y="4" width="4" height="8" rx="2" fill="#2E2380"/><path d="M13 26l5 5 9-10" stroke="#1FB57A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Daily<span class="dot" id="dDot">!</span></button>
  <button type="button" class="on" data-p="home" aria-label="Home" aria-current="page"><svg viewBox="0 0 40 40"><path d="M20 3l5 10.5 11.5 1.6-8.3 8 2 11.4L20 29l-10.2 5.5 2-11.4-8.3-8 11.5-1.6z" fill="#FFC21F" stroke="#C98500" stroke-width="2" stroke-linejoin="round"/></svg>Home</button>
  <button type="button" data-p="bag" aria-label="My crackers"><svg viewBox="0 0 40 40"><rect x="6" y="14" width="28" height="22" rx="4" fill="#FFC21F"/><path d="M13 14v-3a7 7 0 0 1 14 0v3" stroke="#fff" stroke-width="3.5" fill="none"/><rect x="6" y="20" width="28" height="4" fill="#E8A400"/><circle cx="20" cy="22" r="3.5" fill="#fff"/></svg>Crackers</button>
  <button type="button" data-p="set" aria-label="Settings"><svg viewBox="0 0 40 40"><path d="M20 4l4 4.5 6-1 1.5 6 5 3.5-3 5.5 3 5.5-5 3.5L30 37.5l-6-1L20 41l-4-4.5-6 1L8.5 31.5l-5-3.5 3-5.5-3-5.5 5-3.5L10 7.5l6 1z" fill="#fff" transform="scale(.9) translate(2.2 -1)"/><circle cx="20" cy="20" r="6" fill="#7B68E0"/></svg>Settings</button>
 </nav>
 <div class="sheet" id="sheet"><div class="sbox"><button class="x" id="sClose" aria-label="Close">&#215;</button><h2 id="sTitle"></h2><div id="sBody"></div></div></div>
</section>
<section id="game" class="scr"><div class="hud"><button class="sq sm" id="bQuit" aria-label="Back to map">&#8249;</button><div class="face"><canvas id="face"></canvas></div><div class="hgoals" id="gGoals"></div><div class="mv"><small id="gName">Level 1</small><b id="gMoves">20</b><small>moves</small></div></div><div class="sbar" id="sbar"><div class="sfill" id="sFill"></div><i style="left:30%">&#9733;</i><i style="left:60%">&#9733;</i><i style="left:calc(100% - 14px)">&#9733;</i></div><div class="gcoin"><img src="art/ui-coin.webp" alt="Coins"><b id="gCoins">0</b></div>
 <canvas id="board"></canvas><div class="slots" id="slots"></div><div id="endDim"></div><div class="cheer" id="cheer"></div><div class="shuf" id="shuf">No matches left. Mixing the tiles</div><div id="bw"></div><canvas id="deb"></canvas><canvas id="sp" width="780" height="1688"></canvas></section>
<section id="win" class="scr"><div class="wbg" id="wbg"></div><canvas id="wfx" width="780" height="1688"></canvas><div class="wcard" id="wcard"><div class="ribbon"><span>Level Complete!</span></div><div class="wlv" id="wLv">Level 1</div><div class="wstars" id="wStars"></div><div class="wcoin"><img src="art/ui-coin.webp" alt="Coins"><b id="wCoins">0</b></div><div class="wrew" id="wRew"><img id="wRewI" alt=""><span id="wRewT"></span></div><button class="play nxt" id="bNext">Continue</button></div></section>
<section id="bonusEnd" class="scr"><div class="wbg" id="beBg"></div><div class="wcard be"><div class="ribbon"><span>Coin Blast!</span></div><div class="wlv">Total coins earned</div><div class="becoin"><img src="art/ui-coin.webp" alt="Coins"><b id="beN">0</b></div><button class="play nxt" id="beNext">Next Level</button><button class="ghost" id="beMap">Map</button></div></section>
<section id="lose" class="scr"><div class="box"><h1>Out of moves</h1><p>So close! Keep going?</p><button class="play" id="bAd">Watch video: +4 moves</button><button class="play alt" id="bCoin">300 coins: +5 moves</button><p class="lmsg" id="lMsg"></p><button class="ghost" id="bRetry">Try level again</button><button class="ghost" id="bHome">Back to map</button></div></section>
<section id="done" class="scr"><div class="box"><h1>You finished level 10!</h1><p>More levels are coming.</p><button class="play" id="bHome2">Back to map</button></div></section>
<div class="modal" id="lc"><div class="hang"><i class="str a"></i><i class="str b"></i><div class="lcard"><button class="x" id="lClose" aria-label="Close">&#215;</button><h2 id="lNum"></h2><p id="lName"></p><div class="lgoals" id="lGoals"></div><small id="lMoves"></small><h3>Buy crackers for this level <span class="have"><img src="art/ui-coin.webp" alt="Coins"><b id="lCoins">0</b></span></h3><div class="lboost" id="lBoost"></div><button class="play" id="lPlay">Play</button></div></div></div>
<div class="modal ban" id="ban"><div class="bin"><img id="bImg" alt=""><h2 id="bTitle"></h2><p id="bLine"></p><small>Tap to continue</small></div></div><div class="modal buy" id="buy"><div class="box"><img id="buyI" alt=""><h1 id="buyT"></h1><p id="buyP"></p><button class="play" id="buyY">Buy</button><button class="ghost" id="buyN">Not now</button></div></div>
<svg id="hand" width="72" height="88" viewBox="0 0 72 88" aria-hidden="true"><path d="M26 8c0-7 11-7 11 0v28c1-6 11-6 11 1 1-5 10-4 10 2 1-4 9-3 9 3v18c0 13-8 24-22 24H37c-9 0-14-5-19-13L4 47c-3-6 5-11 9-6l13 13z" fill="#FFD9B8" stroke="#1F1B3A" stroke-width="3" stroke-linejoin="round"/></svg><img id="ghost" alt="">
</div>
<script src="art/crackers.js"></script><script src="scene.js"></script><script src="fx.js"></script><script src="face.js"></script><script src="art/sounds-data.js"></script><script src="sound.js"></script><script src="art/three.min.js"></script><script src="intro.js"></script><script src="levels.js"></script><script src="app.js"></script>
</body></html>
