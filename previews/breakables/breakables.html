/* ---------- helpers ---------- */
function seeded(n){var s=n*9301+49297;return function(){s=(s*9301+49297)%233280;return s/233280}}
function jag(r,x0,y0,x1,y1,n,amp){var P=[[x0,y0]],dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy)||1;for(var i=1;i<n;i++){var f=i/n,o=(r()*2-1)*amp;P.push([x0+dx*f-dy/d*o,y0+dy*f+dx/d*o])}P.push([x1,y1]);return P}
